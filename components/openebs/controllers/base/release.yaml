---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: openebs
      # https://github.com/openebs/openebs/releases
      version: "4.4.0" # {"$imagepolicy": "openebs:openebs:tag"}
      sourceRef:
        kind: HelmRepository
        name: openebs
  releaseName: openebs
  # https://openebs.io/docs/quickstart-guide/installation
  # https://github.com/openebs/openebs/blob/main/charts/values.yaml
  # https://github.com/bitnami/charts/blob/main/bitnami/etcd/values.yaml
  # https://github.com/openebs/mayastor-extensions/blob/main/chart/values.yaml
  values:
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: true
          keep: true

    # Refer to https://github.com/openebs/dynamic-localpv-provisioner/blob/v4.4.0/deploy/helm/charts/values.yaml for complete set of values.
    localpv-provisioner:
      global:
        # Used as default image registry, values supplied by localpv.image.registry
        # and helperPod.image.registry override this value.
        imageRegistry: "docker.io"

      rbac:
        # rbac.create: `true` if rbac resources should be created
        create: true
        # rbac.pspEnabled: `true` if PodSecurityPolicy resources should be created
        pspEnabled: false

      earlyEvictionTolerations:
        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 5
        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 5

      localpv:
        name: localpv-provisioner
        enabled: true
        image:
          registry: ""
          repository: openebs/provisioner-localpv
          tag: 4.4.0-prerelease
          pullPolicy: IfNotPresent
        updateStrategy:
          type: RollingUpdate
        # If set to false, containers created by the localpv provisioner will run without extra privileges.
        privileged: true
        annotations: {}
        podAnnotations: {}
        ## Labels to be added to localpv provisioner deployment pods
        podLabels:
          name: openebs-localpv-provisioner
        healthCheck:
          initialDelaySeconds: 30
          periodSeconds: 60
        replicas: 1
        enableLeaderElection: true
        basePath: "/var/openebs/local"
        resources:
        # We usually recommend not to specify default resources and to leave this as a conscious
        # choice for the user. This also increases chances charts run on environments with little
        # resources, such as Minikube. If you do want to specify resources, uncomment the following
        # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
        #  limits:
        #    cpu: 100m
        #    memory: 128Mi
        #  requests:
        #    cpu: 100m
        #    memory: 128Mi
        nodeSelector: {}
        tolerations: []
        affinity: {}
        securityContext: {}
        ## Sets priorityClassName in pod
        priorityClassName: ""

      imagePullSecrets:
      # - name: img-pull-secret
      podSecurityContext: {}
      # fsGroup: 2000

      nameOverride: ""
      fullnameOverride: ""

      serviceAccount:
        # Specifies whether a service account should be created
        create: true
        # Annotations to add to the service account
        annotations: {}
        # The name of the service account to use.
        # If not set and create is true, a name is generated using the fullname template
        name:

      hostpathClass:
        # Name of the default hostpath StorageClass
        name: openebs-hostpath
        # If true, enables creation of the openebs-hostpath StorageClass
        enabled: true
        # Available reclaim policies: Delete/Retain, defaults: Delete.
        reclaimPolicy: Delete
        # If true, sets the openebs-hostpath StorageClass as the default StorageClass
        isDefaultClass: false
        # Path on the host where local volumes of this storage class are mounted under.
        # NOTE: If not specified, this defaults to the value of localpv.basePath.
        basePath: ""
        # Custom node affinity label(s) for example "openebs.io/node-affinity-value"
        # that will be used instead of hostnames
        # This helps in cases where the hostname changes when the node is removed and
        # added back with the disks still intact.
        # Example:
        #          nodeAffinityLabels:
        #            - "openebs.io/node-affinity-key-1"
        #            - "openebs.io/node-affinity-key-2"
        nodeAffinityLabels: []
        # Prerequisite: XFS Quota requires an XFS filesystem mounted with
        # the 'pquota' or 'prjquota' mount option.
        xfsQuota:
          # If true, enables XFS project quota
          enabled: false
          # Detailed configuration options for XFS project quota.
          # If XFS Quota is enabled with the default values, the usage limit
          # is set at the storage capacity specified in the PVC.
          softLimitGrace: "0%"
          hardLimitGrace: "0%"
        # Prerequisite: EXT4 Quota requires an EXT4 filesystem mounted with
        # the 'prjquota' mount option.
        ext4Quota:
          # If true, enables XFS project quota
          enabled: false
          # Detailed configuration options for EXT4 project quota.
          # If EXT4 Quota is enabled with the default values, the usage limit
          # is set at the storage capacity specified in the PVC.
          softLimitGrace: "0%"
          hardLimitGrace: "0%"

      helperPod:
        image:
          registry: ""
          repository: openebs/linux-utils
          pullPolicy: IfNotPresent
          # Overrides the image tag whose default is the chart appVersion.
          tag: 4.3.0
        hostNetwork: false

      # Additional labels to add to all chart resources
      extraLabels: {}

      loggingLabels:
        openebs.io/logging: "true"

      analytics:
        enabled: false
        # Specify in hours the duration after which a ping event needs to be sent.
        pingInterval: "24h"

    # Refer to https://github.com/openebs/zfs-localpv/blob/v2.6.2/deploy/helm/charts/values.yaml for complete set of values.
    zfs-localpv:
      crds:
        zfsLocalPv:
          enabled: true
        csi:
          volumeSnapshots:
            enabled: false

    # Refer to https://github.com/openebs/lvm-localpv/blob/lvm-localpv-1.6.2/deploy/helm/charts/values.yaml for complete set of values.
    lvm-localpv:
      crds:
        lvmLocalPv:
          enabled: true
        csi:
          volumeSnapshots:
            enabled: false

    # Refer to https://github.com/openebs/mayastor-extensions/blob/v2.7.3/chart/values.yaml for complete set of values.
    mayastor:
      csi:
        node:
          initContainers:
            enabled: true
      etcd:
        # -- Kubernetes Cluster Domain
        clusterDomain: cluster.local
      localpv-provisioner:
        enabled: false
      crds:
        enabled: false

    # -- Configuration options for pre-upgrade helm hook job.
    preUpgradeHook:
      image:
        # -- The container image registry URL for the hook job
        registry: docker.io
        # -- The container repository for the hook job
        repo: bitnami/kubectl
        # -- The container image tag for the hook job
        tag: "1.25.15"
        # -- The imagePullPolicy for the container
        pullPolicy: IfNotPresent

    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false

    # Single Replica Deployment (Filesystem Volume)
    # https://github.com/openebs/mayastor-extensions/blob/v2.10.0/chart/loki-storage.md
    loki:
      enabled: true

      loki:
        schemaConfig:
          configs:
            - from: "2024-04-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: loki_index_
                period: 24h
        commonConfig:
          replication_factor: 1
        storage:
          type: filesystem

      singleBinary:
        replicas: 1
        drivesPerNode: 1
        persistence:
          enabled: true

      minio:
        enabled: false
